[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
ledgerscope-domain = { path = "crates/domain" }
ledgerscope-application = { path = "crates/application" }
ledgerscope-adapters = { path = "crates/adapters" }

tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "net",
] }
tokio-stream = "0"
async-stream = "0"
futures = "0"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0"
bon = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
hex = "0"
alloy-primitives = "1"
reqwest = { version = "0", features = ["json", "socks"] }
axum = "0"
petgraph = "0"
rangemap = "1"
