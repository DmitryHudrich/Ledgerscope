[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
ledgerscope-domain = { path = "crates/domain" }
ledgerscope-application = { path = "crates/application" }
ledgerscope-adapters = { path = "crates/adapters" }

tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "net",
] }
tokio-stream = "0"
async-stream = "0"
futures = "0"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0"
bon = "3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serde_urlencoded = "0.7"
hex = "0"
alloy-primitives = "1"
alloy = { version = "2", features = ["providers", "provider-http", "rpc-types-eth", "json-rpc"] }
tower = "0.5"
reqwest = { version = "0", features = ["json", "query", "socks"] }
redis = { version = "1", features = ["tokio-comp", "connection-manager"] }
axum = "0"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-scalar = { version = "0.3", features = ["axum"] }
rangemap = "1"
