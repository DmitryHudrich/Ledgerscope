# Production stand-in for the vite dev proxy: the SPA and the C# API must be
# same-origin (Ledgerscope.Accounts ships no CORS policy), so nginx serves the
# static bundle and forwards /api + /hubs to the accounts service.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # Docker's embedded DNS, so a restarted accounts container is re-resolved
    # instead of nginx caching its first IP forever.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Hashed vite assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # REST. The frontend prefixes calls with /api; the service serves them at
    # the root (/auth/login, /cases, ...), so strip the prefix — same rewrite
    # the vite dev proxy performs.
    location /api/ {
        set $accounts_upstream http://accounts:8080;
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass $accounts_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ingest kicks off long-running engine work behind a single request.
        proxy_read_timeout 300s;
    }

    # SignalR graph hub: negotiate over HTTP, then upgrade to websocket.
    location /hubs/ {
        set $hub_upstream http://accounts:8080;
        proxy_pass $hub_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Client-side routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
