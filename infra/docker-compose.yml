name: ledgerscope

# Both services share the host network namespace so that the fetcher can reach a
# SOCKS proxy bound to the host's 127.0.0.1. On Linux a bridged container cannot:
# host.docker.internal resolves to the bridge gateway (172.17.0.1), and a
# loopback-only listener never answers there. See README.md for the isolated
# bridge variant, which needs the proxy bound to 0.0.0.0 instead.

services:
  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    image: ledgerscope/web-api:dev
    network_mode: host
    environment:
      ETH_RPC_URL: ${ETH_RPC_URL:?set ETH_RPC_URL in infra/.env}
      # Host loopback, because the namespace is shared. Empty = direct connection.
      ETH_RPC_PROXY: ${ETH_RPC_PROXY-socks5h://127.0.0.1:2080}
      # Loopback-only: the browser reaches the API through the web service.
      BIND_ADDR: 127.0.0.1:${API_PORT:-3000}
      API_PORT: ${API_PORT:-3000}
      RUST_LOG: ${RUST_LOG:-info}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${API_PORT}/ >/dev/null"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    image: ledgerscope/web:dev
    network_mode: host
    environment:
      # Rendered into nginx.conf at startup; must stay above 1024 (nginx runs
      # unprivileged) and match the API's port.
      WEB_PORT: ${WEB_PORT:-8080}
      API_PORT: ${API_PORT:-3000}
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:$${WEB_PORT}/ >/dev/null"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
