server:
  bind_addr: ${BIND_ADDR:-127.0.0.1:3000}

log:
  filter: ${RUST_LOG:-info}

eth:
  rpc:
    url: ${ETH_RPC_URL:?set it in infra/.env or export it}
    proxy: ${ETH_RPC_PROXY-socks5h://127.0.0.1:2080}
    rps: ${ETH_RPC_RPS:-15}

storage:
  persist_txs: ${STORAGE_PERSIST_TXS:-true}
  clickhouse:
    url: ${CLICKHOUSE_URL:-http://127.0.0.1:8123}
    database: ${CLICKHOUSE_DB:-ledgerscope}
    user: ${CLICKHOUSE_USER:-ledgerscope}
    password: ${CLICKHOUSE_PASSWORD:-ledgerscope}
  redis:
    url: ${REDIS_URL:-redis://127.0.0.1:6379}
