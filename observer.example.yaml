# mode: sni   — client connects to the observer by the node hostname, routed by SNI
#       proxy — client uses the observer as its HTTP CONNECT and/or SOCKS5 proxy
#       sniff — passive libpcap capture on an interface (build: --features pcap)
mode: proxy
listen: 0.0.0.0:8443
api: http://127.0.0.1:3000
token: test-agent-token
default_port: 443
min_confidence: 0.0

sniff:
  interface: eth0
  filter: tcp port 443

groups:
