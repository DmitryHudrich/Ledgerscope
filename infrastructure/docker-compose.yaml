# Full PayTraces stack: SPA -> Ledgerscope.Accounts (C#) -> aml-core (Rust)
# -> Postgres/Redis, with all outbound calls to external blockchain APIs
# funnelled through the `proxy` service. Copy .env.example to .env first.
#
#   docker compose up -d --build
#
# Ports (host): frontend ${FRONTEND_PORT:-8081}, accounts ${ACCOUNTS_PORT:-5107},
# engine ${ENGINE_PORT:-8080}, grafana 3000.

x-build-proxy: &build-proxy
  HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
  HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
  NO_PROXY: ${BUILD_NO_PROXY:-localhost,127.0.0.1}

services:
  # ---------------------------------------------------------------- egress --
  # Single, mandatory egress point for every external API the engine talks to
  # (etherscan, alchemy, moralis, trongrid, eth-labels). The engine dials it as
  # socks5h://proxy:1080, so DNS for upstream hosts is resolved here too.
  #
  # By default it egresses directly. Point it at your own upstream by setting
  # PROXY_UPSTREAM_ARG in .env, e.g.
  #   PROXY_UPSTREAM_ARG=-F socks5://host.docker.internal:2080   (proxy on the host)
  #   PROXY_UPSTREAM_ARG=-F socks5://user:pass@vpn.example:1080  (remote proxy)
  proxy:
    image: ginuerzh/gost:2.11.5
    command: -L socks5://:1080 ${PROXY_UPSTREAM_ARG:-}
    restart: unless-stopped
    # Lets PROXY_UPSTREAM_ARG reference a proxy running on the docker host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend

  # -------------------------------------------------------------- datastore --
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wallet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet}
      POSTGRES_DB: ${POSTGRES_DB:-wallet_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wallet} -d ${POSTGRES_DB:-wallet_db}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - backend

  # --------------------------------------------------------------- services --
  # Rust graph engine. Internal-only in spirit (the C# facade is the public
  # API) but published on ENGINE_PORT for /scalar and direct debugging.
  engine:
    build:
      context: ../code/aml-core
      dockerfile: Dockerfile
      args: *build-proxy
    depends_on:
      postgres:
        condition: service_healthy
      proxy:
        condition: service_started
    environment:
      # config.yaml supplies structure (chains, heuristics, scoring); these
      # override the host-specific bits. `config` maps `A__B` -> `a.b`.
      SERVER__HOST: 0.0.0.0
      SERVER__PORT: 8080
      # Shared secret the C# facade presents on every internal call. Empty
      # disables the check (dev only).
      SERVER__API_KEY: ${ENGINE_API_KEY:-}
      DATABASE__URL: postgres://${POSTGRES_USER:-wallet}:${POSTGRES_PASSWORD:-wallet}@postgres:5432/${POSTGRES_DB:-wallet_db}
      TELEMETRY__ENABLED: ${TELEMETRY_ENABLED:-true}
      TELEMETRY__OTLP_ENDPOINT: http://tempo:4317
      # Mandatory proxy for external APIs — every reqwest call goes through it.
      PROXY__SOCKS_URL: ${ENGINE_PROXY_URL:-socks5h://proxy:1080}
      # Provider keys. Empty values are ignored by the key-pool resolver.
      ETHERSCAN__API_KEY: ${ETHERSCAN_API_KEY:-}
      ALCHEMY__API_KEY: ${ALCHEMY_API_KEY:-}
      MORALIS__API_KEY: ${MORALIS_API_KEY:-}
      TRONGRID__API_KEY: ${TRONGRID_API_KEY:-}
      # Disk caches on a volume instead of the container filesystem.
      ETHERSCAN__FILE_CACHE__DIR: /data/etherscan_cache
      MORALIS__CACHE__FILE_CACHE__DIR: /data/moralis_cache
      TRONGRID__FILE_CACHE__DIR: /data/trongrid_cache
    volumes:
      # Edit chains/heuristics/scoring without rebuilding the image.
      - ../code/aml-core/config.yaml:/app/config.yaml:ro
      - engine_cache:/data
    ports:
      - "${ENGINE_PORT:-8080}:8080"
    restart: unless-stopped
    networks:
      - backend

  # Public API: auth, cases, RBAC, SignalR graph hub. Talks to the engine over
  # the internal network with the shared secret.
  accounts:
    build:
      context: ../code/ledgerscope-accounts
      dockerfile: Dockerfile
      args: *build-proxy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Deliberately not service_healthy: auth/cases/RBAC don't need the
      # engine, and a mis-keyed engine shouldn't keep the whole API down.
      # Engine calls surface as 502 via GraphEngineException until it is up.
      engine:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__AccountsDb: Host=postgres;Port=5432;Database=${POSTGRES_DB:-wallet_db};Username=${POSTGRES_USER:-wallet};Password=${POSTGRES_PASSWORD:-wallet};Search Path=accounts
      ConnectionStrings__Redis: redis:6379
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-dev-only-change-me-ledgerscope-signing-key-0123456789}
      Jwt__Issuer: ${JWT_ISSUER:-ledgerscope-accounts}
      Jwt__Audience: ${JWT_AUDIENCE:-ledgerscope-clients}
      GraphEngine__BaseUrl: http://engine:8080
      GraphEngine__ApiKey: ${ENGINE_API_KEY:-}
      GraphEngine__TimeoutSeconds: ${GRAPH_ENGINE_TIMEOUT_SECONDS:-30}
    ports:
      - "${ACCOUNTS_PORT:-5107}:8080"
    restart: unless-stopped
    networks:
      - backend

  frontend:
    build:
      context: ../code/frontend
      dockerfile: Dockerfile
      args:
        <<: *build-proxy
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_GRAPH_HUB_URL: ${VITE_GRAPH_HUB_URL:-/hubs/graph}
    depends_on:
      # nginx resolves `accounts` per request via Docker's DNS (see nginx.conf),
      # so it can serve the SPA before the API finishes booting.
      accounts:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    restart: unless-stopped
    networks:
      - backend

  # ---------------------------------------------------------- observability --
  tempo:
    image: grafana/tempo:2.7.2
    ports:
      - "4317:4317"   # OTLP gRPC (traces in)
      - "4318:4318"   # OTLP HTTP (traces in)
      - "3200:3200"   # Tempo HTTP API (Grafana datasource)
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/config.yaml
      - tempo_data:/var/tempo
    command: -config.file=/etc/tempo/config.yaml
    restart: unless-stopped
    networks:
      - backend

  loki:
    image: grafana/loki:3.3.0
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - backend

  promtail:
    image: grafana/promtail:3.3.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./observability/promtail.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - backend

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_FEATURE_TOGGLES_ENABLE=traceToMetrics
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki
      - tempo
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  loki_data:
  grafana_data:
  tempo_data:
  redis_data:
  engine_cache:
